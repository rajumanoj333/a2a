[project]
name = "streamlit-google-adk-travel-demo"
version = "0.1.0"
description = "A Google ADK multi-agent travel planner using GroqCloud and Streamlit"
requires-python = ">=3.11"
dependencies = [
  "google-adk>=1.17.0",
  "groq>=0.31.0",
  "python-dotenv>=1.0.1",
  "streamlit>=1.48.0",
]

[tool.setuptools]
py-modules = ["app", "travel_agents", "groq_adk_model"]
